<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FigHub — Email Confirmed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1E2235;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #272B3F;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: #FFB300;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #FFB300;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 13px;
      color: #8B92B0;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: #2E3350;
      margin: 0 -32px 28px;
    }

    .checkmark {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: #8B92B0;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn-open {
      display: block;
      width: 100%;
      padding: 16px;
      background: #4F8EF7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn-open:active { opacity: 0.85; }

    /* Only shown on mobile */
    #open-app-section { display: none; }

    .download-label {
      font-size: 13px;
      color: #5C6280;
      margin-bottom: 14px;
    }

    .store-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .store-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 10px;
      background: #1E2235;
      border: 1px solid #2E3350;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: border-color 0.15s;
    }
    .store-btn:hover { border-color: #4F8EF7; }
    .store-btn svg { flex-shrink: 0; }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      font-size: 13px;
      color: #F87171;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧱</div>
    <div class="brand">FigHub</div>
    <div class="tagline">Your LEGO minifig collection, scanned &amp; synced</div>
    <div class="divider"></div>

    <div class="checkmark">✅</div>
    <h1>Email confirmed!</h1>
    <p class="subtitle" id="subtitle">Open FigHub on your phone to start collecting your minifigs.</p>

    <!-- Shown only on mobile -->
    <div id="open-app-section">
      <a class="btn-open" id="open-btn" href="#">Open FigHub</a>
    </div>

    <p class="download-label" id="download-label">Download FigHub</p>
    <div class="store-buttons">
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.fighub.app" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#4F8EF7"><path d="M3.18 23.76A2 2 0 0 1 2 22V2A2 2 0 0 1 3.18.24L13.9 12 3.18 23.76ZM16.5 15.4l-2.38-2.38 2.38-2.38 2.74 1.58a1.25 1.25 0 0 1 0 2.2L16.5 15.4ZM5.2 23l9.12-9.12 2.38 2.38L5.2 23ZM5.2 1l11.5 6.74-2.38 2.38L5.2 1Z"/></svg>
        Google Play
      </a>
      <a class="store-btn" href="https://apps.apple.com/app/fighub/id0000000000" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11Z"/></svg>
        App Store
      </a>
    </div>

    <div class="error-msg" id="error-msg">
      Couldn't open FigHub automatically. Tap the button above or download the app from your app store.
    </div>
  </div>

  <script>
    (function () {
      // Extract code from URL params (Supabase appends ?code=xxx after redirect)
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      // Detect mobile OS
      const ua = navigator.userAgent || '';
      const isAndroid = /android/i.test(ua);
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isMobile = isAndroid || isIOS;

      const openSection = document.getElementById('open-app-section');
      const openBtn = document.getElementById('open-btn');
      const subtitleEl = document.getElementById('subtitle');
      const downloadLabel = document.getElementById('download-label');
      const errorMsg = document.getElementById('error-msg');

      if (isMobile && code) {
        openSection.style.display = 'block';
        subtitleEl.textContent = 'Tap the button below to open FigHub and complete sign in.';
        downloadLabel.textContent = "Don't have FigHub yet? Download it:";

        // Build the deep link with the code
        const encodedCode = encodeURIComponent(code);

        if (isAndroid) {
          // intent:// URI works in Chrome on Android even without auto-redirect permission
          const intentUri =
            'intent://login-callback?code=' + encodedCode +
            '#Intent;scheme=com.fighub.app;package=com.fighub.app;end';
          openBtn.href = intentUri;
        } else {
          // iOS: custom scheme opens directly in Safari when app is installed
          openBtn.href = 'com.fighub.app://login-callback?code=' + encodedCode;
        }

        // Auto-attempt after a short delay (Safari/WebView allows this)
        setTimeout(function () {
          if (document.hasFocus() || isIOS) {
            window.location.href = openBtn.href;
          }
        }, 800);

        // If page is still visible after 2.5 s the app didn't open — show error hint
        setTimeout(function () {
          if (!document.hidden) {
            errorMsg.style.display = 'block';
          }
        }, 2500);

      } else if (!isMobile) {
        subtitleEl.textContent = 'Open FigHub on your phone to start collecting. Your account is ready.';
      } else if (!code) {
        // No code in URL — confirmation may have already been processed
        subtitleEl.textContent = 'Your email is confirmed. Open FigHub on your phone to sign in.';
      }
    })();
  </script>
</body>
</html>
